goal: "把六世界设计实装为可独立试玩的内容包，保留既有模板、素材工作与玩家存档"
keyresults:
  - kr-1: "六世界都有零级导入、主视图、首个行动和可检查的阶段回报"
  - kr-2: "路径与 ID 统一英文；标题、正文和世界提示词随世界语言"
  - kr-3: "雾坞双物件门禁、时间优先层级、可拒绝判定与生成完成检查有测试"
  - kr-4: "编译与离线探针通过；真实模型和浏览器结果分开报告"
rules:
  - id: six-world-content
    name: playable-world-contracts
    apply: "tools/experiences/**"
    level: error
    desc:
      - "场景 README 承担环境和入口，Chalk 提供行动意图，世界 skill 维护连续性"
      - "不得预填玩家推论、生成结果或把测试夹具宣称为实时生成"
      - "骰子只在披露条件、概率、回报、代价后由玩家主动投掷"
      - "安装器只新建内容模板；已有目录拒绝覆盖；不得写入原模板和存档"
