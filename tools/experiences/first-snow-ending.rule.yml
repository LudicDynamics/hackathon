goal: "初雪以信物与实际RP结算决定之夜，生成CG旁白与主动开启的后日谈"
keyresults:
  - "入场无信物硬门槛；孤独之夜也是有效结局；进入不自动结算"
  - "单边、双边到访、双重承诺与自由 RP 都能继续，不被首次赴约锁死"
  - "七海、澄、双线交汇、孤独四类由RP判定，不预选角色；CG不裁决剧情"
  - "只改体验版提示词、模板与验收，不改引擎、素材版或旧存档"
rules:
  - id: rp-before-ending
    name: first-snow-open-ending
    apply: "tools/experiences/first-snow-closing.mjs"
    level: error
    desc:
      - "今晚的信是可更新的经历记录，不是独占路线或完结标记"
      - "未去另一边不自动等于爽约，不预写冷杯、空椅或第三结局"
      - "结局从全层实际 RP 现场写三至六句，不按 CG、最后点击或角色计数套模板"
      - "回访复用已写结局，写入中断只补缺件；不把离线检查说成真实模型通关"
      - "承诺信物经move入包后确认；生图失败保留旁白；后日谈分玩家回合"
