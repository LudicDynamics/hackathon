goal: "初雪保留七海与澄两个 fallback 收束选项，超出时按本局 RP 现场写更多可能"
keyresults:
  - "无实际互动时继续引导；进入场景不等于答应或恋爱"
  - "单边、双边到访、双重承诺与自由 RP 都能继续，不被首次赴约锁死"
  - "七海与澄两个 fallback 可用；复杂 RP 不强塞回二选一，CG 不裁决剧情"
  - "只改体验版提示词、模板与验收，不改引擎、素材版或旧存档"
rules:
  - id: rp-before-ending
    name: first-snow-open-ending
    apply: "tools/experiences/first-snow.mjs"
    level: error
    desc:
      - "今晚的信是可更新的经历记录，不是独占路线或完结标记"
      - "未去另一边不自动等于爽约，不预写冷杯、空椅或第三结局"
      - "结局从全层实际 RP 现场写三至六句，不按 CG、最后点击或角色计数套模板"
      - "回访复用已写结局，写入中断只补缺件；不把离线检查说成真实模型通关"
