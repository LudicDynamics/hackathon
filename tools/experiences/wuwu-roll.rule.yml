goal: "仅通过雾坞 Chalk 与世界规则实现判定后的短反馈、可继续行动与点击后揭示"
keyresults:
  - "保留真实骰点和原有四档奖惩，不免费重掷、不重复扣油或发奖"
  - "准备骰子时即保留继续入口；失败有具体补救，成功须点击才生成完整场景"
  - "日语提示词、英文稳定路径；模板与编译源一致；不改引擎或旧存档"
rules:
  - id: chalk-only
    name: wuwu-roll-continuation
    apply: "tools/experiences/wuwu.mjs"
    level: error
    desc:
      - "即时反馈不等待生图；损害由作家真实写入后才称已结算"
      - "无 result 时点击继续不能代掷或提前生成；已掷时不再显示仅限掷前的退回文案"
      - "成功记录待揭示，完整发现与生成只由玩家继续选择触发"
      - "失败有不依赖灯油与重复骰子的调查动作；恢复只补缺失内容"
