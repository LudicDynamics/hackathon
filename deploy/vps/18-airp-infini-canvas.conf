# BEGIN airp-infini-canvas
	# airp-infini-canvas — AIRP 无限画布（黑客松公开入口）。公开访问，不加白名单和 basic auth。
	# 后端是 /root/airp 的座位网关（127.0.0.1:8870），每位玩家独占一个容器；源码 deploy/vps/。
	# ^~ 让正则 location（03-security 等）不截走本路径下的请求。
	location = /airp-infini-canvas { return 301 /airp-infini-canvas/; }
	location ^~ /airp-infini-canvas/ {
		proxy_pass http://127.0.0.1:8870/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $http_connection;
		proxy_read_timeout 3600s;
		proxy_send_timeout 600s;
		proxy_buffering off;
		client_max_body_size 64m;
	}
# END airp-infini-canvas
