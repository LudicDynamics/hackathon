# AIRP public entry. HTTPS only on purpose: plain http://ludic-test.xvps.jp
# stays on the host's default server, which serves other apps under subpaths.
server {
    listen 220.158.18.52:443 ssl;
    listen 127.0.0.1:443 ssl;
    listen [::1]:443 ssl;
    http2 on;
    server_name ludic-test.xvps.jp;
    ssl_certificate     /etc/letsencrypt/live/ludic-test.xvps.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ludic-test.xvps.jp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 64m;
    location / {
        proxy_pass http://127.0.0.1:8870;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
