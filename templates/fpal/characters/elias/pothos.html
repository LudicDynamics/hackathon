<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Balcony - 空位</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #e3e1dc;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  svg {
    width: 800px;
    height: 600px;
    background: #f5f4f1;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    border: 1px solid #c9c6c0;
  }
  .caption {
    font-family: "Times New Roman", serif;
    font-style: italic;
    fill: #8a867f;
    font-size: 12px;
    text-anchor: end;
  }
</style>
</head>
<body>

<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 阴天光：灰白，从遮光帘拉开的缝里进来 -->
    <linearGradient id="overcast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eceae6"/>
      <stop offset="60%" stop-color="#e2e0db"/>
      <stop offset="100%" stop-color="#d8d6d0"/>
    </linearGradient>
    <!-- 缝隙里那道光，边缘是软的 -->
    <linearGradient id="lightgap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f6f2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f7f6f2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfc9bf"/>
      <stop offset="100%" stop-color="#c2bcb1"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- 阴天的天光 -->
  <rect x="0" y="0" width="800" height="360" fill="url(#overcast)"/>
  <!-- 阳台地面 -->
  <rect x="0" y="360" width="800" height="240" fill="url(#floor)"/>
  <!-- 地砖缝，几道浅线 -->
  <line x1="0" y1="430" x2="800" y2="424" stroke="#b6b0a5" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="510" x2="800" y2="502" stroke="#b6b0a5" stroke-width="1" opacity="0.4"/>

  <!-- 遮光帘，拉开一半，收在左边 -->
  <g>
    <path d="M 0 0 L 0 360 L 120 360 C 100 240, 110 120, 96 0 Z" fill="#e8e5df" stroke="#d5d1c9" stroke-width="1"/>
    <path d="M 18 0 C 30 120, 22 240, 40 360" stroke="#d8d4cc" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 50 0 C 58 120, 52 240, 66 360" stroke="#d8d4cc" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  <!-- 缝隙漏进来的光，落在地上 -->
  <path d="M 120 360 L 340 360 L 300 600 L 60 600 Z" fill="url(#lightgap)"/>

  <!-- 栏杆，封闭阳台的玻璃和框，极简两根竖框 -->
  <line x1="640" y1="60" x2="640" y2="360" stroke="#b3aea6" stroke-width="4"/>
  <line x1="800" y1="80" x2="800" y2="360" stroke="#b3aea6" stroke-width="4"/>
  <line x1="640" y1="90" x2="800" y2="96" stroke="#c6c2ba" stroke-width="3" opacity="0.8"/>

  <!-- ===== 左：绿萝。酒店配的，油亮，规矩。周六之后归我。 ===== -->
  <g>
    <!-- 影子很淡，阴天没有硬影子 -->
    <ellipse cx="215" cy="480" rx="75" ry="12" fill="#a89f92" opacity="0.35" filter="url(#blur)"/>
    <!-- 陶盆 -->
    <path d="M 150 380 C 148 450, 156 470, 210 472 C 264 470, 272 450, 270 380 Z" fill="#c98d63" stroke="#a9714b" stroke-width="1.5"/>
    <ellipse cx="210" cy="380" rx="60" ry="14" fill="#b97d54"/>
    <ellipse cx="210" cy="380" rx="50" ry="10" fill="#5d4a3a"/>
    <!-- 盆沿粉笔笑脸。2007年的习惯，戒不掉，也不想戒 -->
    <g transform="translate(240, 366)">
      <circle cx="-7" cy="0" r="2" fill="#f5efe4"/>
      <circle cx="7" cy="0" r="2" fill="#f5efe4"/>
      <path d="M -8 6 Q 0 12, 8 6" stroke="#f5efe4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 叶簇：向上的几支 -->
    <g stroke="#4e6b44" stroke-width="2" fill="none">
      <path d="M 205 378 C 200 340, 190 320, 172 300"/>
      <path d="M 212 378 C 216 336, 226 314, 244 296"/>
      <path d="M 209 378 C 209 340, 210 318, 208 288"/>
    </g>
    <!-- 心形叶，油亮那种绿 -->
    <g>
      <path d="M 172 300 C 152 296, 148 272, 166 266 C 180 262, 190 276, 184 292 C 181 298, 177 301, 172 300 Z" fill="#6b8e5a" stroke="#557446" stroke-width="1"/>
      <path d="M 244 296 C 264 290, 268 266, 250 262 C 236 259, 227 274, 233 288 C 236 294, 240 297, 244 296 Z" fill="#7fa66b" stroke="#5d7f4c" stroke-width="1"/>
      <path d="M 208 288 C 190 278, 190 254, 208 252 C 222 250, 230 266, 222 280 C 219 285, 214 288, 208 288 Z" fill="#74975f" stroke="#557446" stroke-width="1"/>
      <path d="M 172 300 C 158 312, 150 322, 146 338" stroke="#5d7f4c" stroke-width="1.5" fill="none"/>
      <path d="M 146 338 C 130 336, 122 318, 136 310 C 148 304, 160 316, 154 330 C 152 334, 149 337, 146 338 Z" fill="#6b8e5a" stroke="#557446" stroke-width="1"/>
      <!-- 叶尖的高光，表现"油亮" -->
      <path d="M 208 258 C 214 258, 219 262, 221 268" stroke="#a3c28e" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round"/>
      <path d="M 170 270 C 175 268, 180 270, 183 274" stroke="#a3c28e" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
    </g>
    <!-- 垂下来的一支长藤，越过地面，往右边去 -->
    <path d="M 220 380 C 250 400, 300 430, 360 448 C 410 462, 470 468, 520 462" stroke="#5d7f4c" stroke-width="2.5" fill="none"/>
    <g>
      <path d="M 360 448 C 356 462, 342 466, 334 456 C 328 448, 336 438, 348 440 C 355 442, 359 444, 360 448 Z" fill="#6b8e5a" stroke="#557446" stroke-width="1"/>
      <path d="M 440 466 C 438 480, 424 486, 414 478 C 407 471, 413 459, 426 460 C 434 461, 439 463, 440 466 Z" fill="#7fa66b" stroke="#5d7f4c" stroke-width="1"/>
      <path d="M 520 462 C 522 476, 536 482, 546 474 C 553 467, 547 455, 534 456 C 526 457, 521 459, 520 462 Z" fill="#6b8e5a" stroke="#557446" stroke-width="1"/>
    </g>
  </g>

  <!-- ===== 右：空位。周六之后填上。虚线的盆，虚线的薄荷。 ===== -->
  <g opacity="0.85">
    <!-- 空盆：虚线勾的，还不存在的东西只能这么画 -->
    <path d="M 540 400 C 538 460, 546 476, 596 478 C 646 476, 654 460, 652 400 Z"
          fill="none" stroke="#9a948a" stroke-width="2" stroke-dasharray="7 6"/>
    <ellipse cx="596" cy="400" rx="56" ry="13" fill="none" stroke="#9a948a" stroke-width="2" stroke-dasharray="7 6"/>
    <!-- 虚线的薄荷：一小丛，画得比绿萝矮，叶子对生 -->
    <g stroke="#8fa58f" stroke-width="2" stroke-dasharray="4 4" fill="none">
      <path d="M 580 398 C 578 376, 574 362, 566 348"/>
      <path d="M 596 398 C 598 372, 600 356, 598 340"/>
      <path d="M 612 398 C 616 378, 622 364, 630 352"/>
    </g>
    <g fill="none" stroke="#8fa58f" stroke-width="1.5" stroke-dasharray="3 4">
      <path d="M 566 348 C 554 342, 552 328, 562 324 C 572 321, 580 332, 574 342 C 571 346, 569 348, 566 348 Z"/>
      <path d="M 598 340 C 610 334, 612 320, 602 316 C 592 313, 584 324, 590 334 C 593 338, 596 340, 598 340 Z"/>
      <path d="M 630 352 C 642 346, 644 332, 634 328 C 624 325, 616 336, 622 346 C 625 350, 628 352, 630 352 Z"/>
    </g>
    <!-- 长藤的尽头，差一点点就够到盆沿。植物自己会越界，我不用催 -->
    <text x="596" y="512" font-size="11" fill="#8a867f" text-anchor="middle" font-family="sans-serif" opacity="0.9">待认领</text>
  </g>

  <text x="770" y="572" class="caption">Balcony. 1806. Overcast — 空位保留，等周六。</text>
</svg>

</body>
</html>
